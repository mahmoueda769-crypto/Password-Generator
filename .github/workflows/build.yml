name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Source code ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java (JAVA_HOME set automatically) ────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Python ─────────────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ── 4. Android SDK via official action ───────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. NDK + build tools (full sdkmanager path for reliability) ──────
      - name: Install NDK 25b and build tools
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.1.8937393" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "platform-tools"

      # ── 6. Inject SDK/NDK paths directly into buildozer.spec ─────────────
      #    Buildozer reads android.sdk_path and android.ndk_path from the spec.
      #    This is more reliable than env vars.
      - name: Inject SDK/NDK paths into buildozer.spec
        run: |
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.1.8937393"
          echo ""                                          >> buildozer.spec
          echo "android.sdk_path = $ANDROID_SDK_ROOT"    >> buildozer.spec
          echo "android.ndk_path = $NDK_PATH"            >> buildozer.spec
          echo "--- Injected paths ---"
          echo "SDK: $ANDROID_SDK_ROOT"
          echo "NDK: $NDK_PATH"

      # ── 7. Fix git:// protocol (prevents p4a clone failure) ───────────────
      - name: Fix git protocol
        run: git config --global url."https://".insteadOf git://

      # ── 8. All system packages needed by p4a recipes ──────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev \
            libbz2-dev libreadline-dev libgdbm-dev \
            liblzma-dev python3-dev \
            build-essential ccache libltdl-dev \
            cmake ninja-build patch \
            lib32stdc++6 lib32z1

      # ── 9. Buildozer + Cython ─────────────────────────────────────────────
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install "buildozer==1.5.0" "cython==0.29.37"

      # ── 10. Cache (speeds up repeated builds) ────────────────────────────
      - name: Cache Buildozer directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-v5-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v5-

      # ── 11. BUILD ─────────────────────────────────────────────────────────
      - name: Build APK
        run: buildozer -v android debug

      # ── 12. Upload APK as artifact ────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: password-generator-apk
          path: bin/*.apk
          retention-days: 30
