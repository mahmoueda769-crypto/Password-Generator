name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ── Android SDK (pre-installed — skips Buildozer download step) ───────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 25b and build tools
        run: |
          sdkmanager --install \
            "ndk;25.1.8937393" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "platform-tools"

      # Export paths so Buildozer uses the pre-installed SDK/NDK
      - name: Export Android env vars
        run: |
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT"                              >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/25.1.8937393"            >> $GITHUB_ENV
          echo "ANDROIDAPI=33"                                             >> $GITHUB_ENV
          echo "ANDROIDMINAPI=21"                                          >> $GITHUB_ENV

      # ── System deps ───────────────────────────────────────────────────────
      - name: Fix git:// protocol
        run: git config --global url."https://".insteadOf git://

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev \
            libbz2-dev libreadline-dev libgdbm-dev \
            liblzma-dev python3-dev \
            build-essential ccache libltdl-dev \
            cmake ninja-build patch \
            lib32stdc++6 lib32z1

      # ── Buildozer ─────────────────────────────────────────────────────────
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install "buildozer==1.5.0" "cython==0.29.37"

      - name: Cache Buildozer directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v3-

      - name: Build APK
        run: buildozer -v android debug

      # ── Artifact ──────────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: password-generator-apk
          path: bin/*.apk
          retention-days: 30
