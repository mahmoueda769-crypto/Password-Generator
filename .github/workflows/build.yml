name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      # 1. كود المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java — JAVA_HOME بيتضبط تلقائي
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Python 3.10 — الأكثر استقراراً مع Buildozer + Cython 0.29.x
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. قبول SDK licenses — لازم يكون قبل أي sdkmanager install
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 5. تثبيت NDK 25b وأدوات البناء المطلوبة
      - name: Install NDK 25b and build tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.1.8937393" \
            "build-tools;33.0.2" \
            "platforms;android-33"

      # 6. حقن مسارات SDK/NDK داخل قسم [app] في buildozer.spec
      #    (sed بيضيف السطرين قبل [buildozer] عشان يكونوا تحت [app] صح)
      - name: Inject SDK/NDK paths into buildozer.spec
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/25.1.8937393"
          sed -i "s|\[buildozer\]|android.sdk_path = $ANDROID_HOME\nandroid.ndk_path = $NDK_PATH\n\n[buildozer]|" buildozer.spec
          echo "=== buildozer.spec final ==="
          cat buildozer.spec

      # 7. إصلاح بروتوكول git:// — يمنع فشل clone الـ p4a
      - name: Fix git protocol
        run: git config --global url."https://".insteadOf git://

      # 8. كل الحزم اللي تحتاجها وصفات p4a
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev \
            libbz2-dev libreadline-dev libgdbm-dev \
            liblzma-dev python3-dev \
            build-essential ccache libltdl-dev \
            cmake ninja-build patch \
            lib32stdc++6 lib32z1

      # 9. Buildozer + Cython
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install "buildozer==1.5.0" "cython==0.29.37"

      # 10. Cache عشان البناء الجاي يكون أسرع
      - name: Cache Buildozer directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-v6-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v6-

      # 11. البناء
      - name: Build APK
        run: buildozer -v android debug

      # 12. رفع الـ APK كـ artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: password-generator-apk
          path: bin/*.apk
          retention-days: 30
